status: TRADING_STRATEGY_DESIGN_DECLARED

development_probability_source: outputs/diagnostics/09_development_regularised_event_probability_panel.csv
locked_probability_source: outputs/diagnostics/09_locked_regularised_event_probability_panel.csv
canonical_market_source: data/processed/18sA_canonical_source_adapters/18sA_canonical_market_panel.csv
certified_outcome_source: data/processed/certified_event_books.csv

