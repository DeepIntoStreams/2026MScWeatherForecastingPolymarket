maximum_positions_per_settlement_date: 1

edge_definition: model_probability_minus_raw_market_price

threshold_grid:
  - 0.00
  - 0.01
  - 0.02
  - 0.03
  - 0.05
  - 0.075
  - 0.10
  - 0.15
  - 0.20

selection_cost_per_trade: 0.01

cost_sensitivity_grid:
  - 0.00
  - 0.005
  - 0.01
  - 0.02
  - 0.03

minimum_development_trades: 8
minimum_balanced_development_dates: 20

selection_score: mean_settlement_date_net_payoff
selection_rule: paired_one_standard_error_conservative_threshold
uncertainty_unit: settlement_date

market_prices_used_for_weather_model_selection: false
market_prices_used_for_continuous_calibration: false
market_prices_used_for_probability_calibration: false

categorically_normalised_market_prices_permitted: false
