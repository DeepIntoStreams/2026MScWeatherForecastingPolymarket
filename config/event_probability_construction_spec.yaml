  lower_tail_unbounded: true
  upper_tail_unbounded: true
  gaps_permitted: false
  overlaps_permitted: false

probability:
  formula: particle_count_in_event_divided_by_99
  minimum_positive_probability: 0.010101010101010102
  probability_resolution: 0.010101010101010102
  probability_sum: 1.0
  zero_probabilities_permitted: true
  regularisation_applied_here: false
  renormalisation_expected: false

scope:
